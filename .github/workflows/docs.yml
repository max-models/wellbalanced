name: Docs

# The Astro + Starlight site in docs/: hand-written pages, the executed notebooks and the API
# reference. Built on every push and pull request with the shared workflow of
# max-models/starlight-theme; deployed to GitHub Pages from devel.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0.4.0
    with:
      # patchwork for the examples on patches (examples/rf_driver_rz.py); it cannot be a
      # listed dependency, "patchwork" on PyPI being an unrelated project
      pre-build: >-
        uv pip install "patchwork @ git+https://github.com/max-models/patchwork@devel"
        && uv run python docs/tools/examples.py
      smoke-paths: |
        getting-started/installation/index.html
        tutorials/index.html
        tutorials/global-model/index.html
        full-examples/index.html
        full-examples/argon-global-model/index.html
        full-examples/argon-discharge-1d/index.html
        full-examples/neutralizer-scan/index.html
        api/wellbalanced/index.html
        api/wellbalanced/global_model/index.html
        api/wellbalanced/fluid1d/index.html
        api/wellbalanced/neutralizer/index.html
        tutorials/global-model/global_model.ipynb
        full-examples/argon-global-model/plot-1.png
