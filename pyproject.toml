[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "wheel" ]

[project]
name = "wellbalanced"
version = "0.1.0"
description = "Global (0D), 1D and 2D fluid and RF-field models of low-temperature plasmas."
readme = "README.md"
keywords = [ "plasma", "global model", "fluid model", "low-temperature plasma", "neutral beam" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "numpy",
  "plasmacoll>=0.3.0",
  "scope-profiler>=0.7.5",
  "scipy",
  "xarray",
]
optional-dependencies.cr = [ "opencr" ]
optional-dependencies.dev = [
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "wellbalanced[docs,test]",
]
optional-dependencies.docs = [
  "griffe",
  "plasma-plots>=0.2.5",
  "ipykernel",
  "matplotlib>=3.10.9",
  "nbclient>=0.11",
  "nbformat>=5.11.1",
  "patchwork-amr>=0.2.0",
  "simgeometry>=0.1.1",
]
optional-dependencies.spatial = [ "patchwork-amr>=0.2.0", "simgeometry>=0.1.1" ]
optional-dependencies.test = [
  "opencr",
  "patchwork-amr>=0.2.0",
  "pytest",
  "pytest-cov",
  "simgeometry>=0.1.1",
]
urls.Source = "https://github.com/max-models/wellbalanced"

[project.entry-points."scope_profiler.opt_in_tags"]
wellbalanced = "wellbalanced"

[tool.setuptools]
package-data."*" = [ "py.typed" ]
packages.find.where = [ "src" ]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = [ "*.ipynb" ]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and pydocstyle
lint.select = [ "B", "D", "E", "F", "I", "UP", "W" ]
lint.ignore = [ "E501" ]  # line length is handled by the formatter
lint.per-file-ignores."**/tests/**" = [ "D" ]
lint.per-file-ignores."*.ipynb" = [ "D" ]
lint.per-file-ignores."docs/tools/*" = [ "D" ]
lint.pydocstyle.convention = "google"

[tool.pyright]
include = [ "src" ]
exclude = [ "**/tests" ]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest]
ini_options.pythonpath = [ "src" ]
ini_options.testpaths = [ "src" ]
ini_options.addopts = "-ra"

[tool.coverage]
run.omit = [ "*/tests/*" ]
run.source = [ "wellbalanced" ]
report.show_missing = true

# PRs to devel test against the devel branches of the max-models packages (pinned in
# uv.lock); PRs to main and the release use PyPI only (CI sets UV_NO_SOURCES).
[tool.uv.sources]
opencr = { git = "https://github.com/max-models/opencr", branch = "devel" }
patchwork-amr = { git = "https://github.com/max-models/patchwork", branch = "devel" }
plasma-plots = { git = "https://github.com/max-models/plasma-plots", branch = "devel" }
plasmacoll = { git = "https://github.com/max-models/plasmacoll", branch = "devel" }
scope-profiler = { git = "https://github.com/max-models/scope-profiler", branch = "devel" }
simgeometry = { git = "https://github.com/max-models/simgeometry", branch = "devel" }
